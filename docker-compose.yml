# Full stack: docker compose up -d --build   (needs Compose v2 + BuildKit)
# Needs .env (copy .env.example) with BOT_TOKEN set for the bot.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    image: garage-crm
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:crm@postgres:5432/crm
      FILE_STORAGE_ROOT: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: .
    image: garage-crm
    command: ["python", "-m", "bot.main"]
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
    # The image's HEALTHCHECK probes the API's HTTP port; the bot has none.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  redisdata:
